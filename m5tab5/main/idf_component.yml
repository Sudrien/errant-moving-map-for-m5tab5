dependencies:
  idf:
    version: ">=5.4.2"

  # cJSON, for M5Launcher's config.conf (launcher_import.c). IDF 6.0
  # moved it out of the tree into the registry; on 5.x the rule is false
  # and CMakeLists.txt requires IDF's own `json`. As defeatist's 6031.
  espressif/cjson:
    version: "^1.7.19"
    rules:
      - if: "idf_version >=6.0"

  # The board, the panel and the storage, from the libraries pulled out of
  # defeatist-music-player-for-m5tab5: since 0040 the components of
  # feckless-libs-for-m5tab5, every one at the same tag. PINNED TO TAGS:
  # a moving branch would change underneath a build that worked.
  # 0043: v0.6.0, and the feckless ABI with its storage and network
  # sections: the map is an ELF built against them (elf/), and the .bin
  # links all three and runs it, as a launcher does. v0.6.0 is the first
  # tag with the network section (feckless-libs' 6004), wifi_psk() (6003)
  # and the drivers in the core list (6002); storage is version 2, with
  # fast seek, since v0.5.0.
  feckless_abi:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi
    version: "v0.6.0"
  feckless_abi_storage:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi_storage
    version: "v0.6.0"
  feckless_abi_network:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi_network
    version: "v0.6.0"
  feckless_drivers:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_drivers
    version: "v0.6.0"
  feckless_graphics_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_graphics_handler
    version: "v0.6.0"
  feckless_storage_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_storage_handler
    version: "v0.6.0"
  # Wi-Fi through the C6, saved networks, USB Ethernet. Brings
  # esp_hosted, esp_wifi_remote, esp_usbh_asix and iot_usbh_ecm with it;
  # its idf_component.yml says why each is pinned or not.
  feckless_network_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_network_handler
    version: "v0.6.0"

  # 0041: from feckless-libs v0.3.0 as well -- fatfs, IDF's FatFs with
  # exFAT (0018's cmake/exfat.cmake did that here); and the two USB class
  # drivers the libraries require by name, with the Tab5's fixes:
  # usb_host_msc for maps on a USB drive (the registry's ^1.1.0 was here),
  # usb_host_uac because feckless_drivers links it (v0.2.0's drivers
  # pinned the registry's).
  fatfs:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/fatfs
    version: "v0.6.0"
  usb_host_msc:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/usb_host_msc
    version: "v0.6.0"
  usb_host_uac:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/usb_host_uac
    version: "v0.6.0"
