# SPDX-License-Identifier: MIT
#
# u-errant-0002: the boxed map's manifest. The map's own
# (../../main/idf_component.yml) with every feckless component on
# feckless-libs' umode branch rather than a release tag, as Defeatist's
# boxed/ and Avoidant's and Spurious's umode branches name it while the box
# is tested, and feckless_box_libc, which links into the ELF. This project's
# dependencies.lock records the commit; it is written by the first
# configure, and its diff is read before it is committed (CLAUDE.md).
dependencies:
  idf:
    version: ">=6.1"
  espressif/cjson:
    version: "^1.7.19"
  feckless_abi:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi
    version: "umode"
  feckless_abi_storage:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi_storage
    version: "umode"
  feckless_abi_network:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi_network
    version: "umode"
  feckless_box_libc:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_box_libc
    version: "umode"
  feckless_drivers:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_drivers
    version: "umode"
  feckless_graphics_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_graphics_handler
    version: "umode"
  feckless_storage_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_storage_handler
    version: "umode"
  feckless_network_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_network_handler
    version: "umode"
  fatfs:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/fatfs
    version: "umode"
  usb_host_msc:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/usb_host_msc
    version: "umode"
  usb_host_uac:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/usb_host_uac
    version: "umode"
